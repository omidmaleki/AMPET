publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1   # Vazirmatn (فاز اول؛ در فاز نهایی فونت asset می‌شود)
  intl: ^0.19.0
